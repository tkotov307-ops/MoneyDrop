      else if(a==="open")openCase();
      else if(a==="keep")claim(false);
      else if(a==="claim")claim(true);
      else if(a==="sell-item")sellInventory([b.dataset.uid]);
      else if(a==="sell-all")sellInventory(state.inventory.map(function(i){return i.uid||i.id;}));
      else if(a==="scroll-cases"){document.getElementById("catalog").scrollIntoView({behavior:"smooth"});}
      else if(a==="logout")signOut();
      else if(a==="auth-open"){state.modal="auth";state.authMode=b.dataset.mode||"login";render();}
      else if(a==="auth-switch"){state.authMode=state.authMode==="signup"?"login":"signup";render();}
      else if(a==="upgrade"){
        var source=document.getElementById("upgrade-source").value,target=document.getElementById("upgrade-target").value;
        if(!source)return toast("Выберите предмет в сейфе");
        rpc("upgrade_item",{p_inventory_id:source,p_target_skin_id:target,p_use_balance:false,p_stake:0}).then(function(r){return refreshProfile().then(function(){render();toast(r.success?"Апгрейд успешен":"Апгрейд неуспешен");});}).catch(function(x){toast(x.message);});
      }
      else if(a==="admin-tab"){state.adminTab=b.dataset.tab;if(state.adminTab==="cases"||state.adminTab==="users"||state.adminTab==="transactions")loadAdmin();render();}
      else if(a==="admin-new-case")newAdminCase();
      else if(a==="admin-edit-case")editAdminCase(b.dataset.id);
      else if(a==="admin-case-cancel"){state.adminCase=null;state.adminCaseItems=[];render();}
      else if(a==="admin-add-prize"){collectCaseEditor();state.adminCaseItems.push({id:"",name:"Новый приз",price:100,kind:"cash",icon:"₽",rarity:"common",chance:1,image_url:""});render();}
      else if(a==="admin-remove-prize"){collectCaseEditor();state.adminCaseItems.splice(Number(b.dataset.index),1);render();}
      else if(a==="admin-normalize-chances")normalizeChances();
      else if(a==="admin-save-case")saveAdminCase();
      else if(a==="admin-delete-case"){var deleteId=b.dataset.id;if(window.confirm("Удалить кейс из каталога?"))rpc("admin_delete_case",{p_case_id:deleteId}).then(function(){return refreshPublic();}).then(loadAdmin).then(function(){toast("Кейс удалён");}).catch(function(x){toast(x.message);});}
      else if(a==="tx-filter"){state.txFilter=b.dataset.filter;render();}
      else if(a==="tx-approve"){rpc("admin_approve_deposit",{p_transaction_id:b.dataset.id}).then(loadAdmin).catch(function(x){toast(x.message);});}
      else if(a==="tx-reject"){rpc("admin_reject_transaction",{p_transaction_id:b.dataset.id}).then(loadAdmin).catch(function(x){toast(x.message);});}
      else if(a==="tx-complete"){rpc("admin_complete_withdraw",{p_transaction_id:b.dataset.id}).then(loadAdmin).catch(function(x){toast(x.message);});}
      else if(a==="tx-refund"){rpc("admin_refund_withdraw",{p_transaction_id:b.dataset.id}).then(loadAdmin).catch(function(x){toast(x.message);});}
      else if(a==="admin-balance"){var id=b.dataset.id,input=document.querySelector('[data-balance-user="'+id+'"]');rpc("admin_set_balance",{p_user_id:id,p_balance:Number(input.value)}).then(loadAdmin).catch(function(x){toast(x.message);});}
      else if(a==="admin-ban"){var banId=b.dataset.id,shouldBan=b.dataset.banned!=="true";rpc("admin_set_ban",{p_user_id:banId,p_is_banned:shouldBan}).then(loadAdmin).catch(function(x){toast(x.message);});}
      else if(a==="admin-grant-item"){var grantId=b.dataset.id,grantSelect=document.querySelector('[data-grant-item="'+grantId+'"]');rpc("admin_grant_item",{p_user_id:grantId,p_item_id:grantSelect.value}).then(loadAdmin).then(function(){toast("Приз выдан в сейф");}).catch(function(x){toast(x.message);});}
      else if(a==="admin-save-settings"){
        function settingValue(id){var el=document.getElementById(id);return el?el.value:"";}
        var paymentSettings={
          sbp_phone:settingValue("setting-sbp-phone"),sbp_bank:settingValue("setting-sbp-bank"),sbp_recipient:settingValue("setting-sbp-recipient"),
          card_number:settingValue("setting-card-number"),card_recipient:settingValue("setting-card-recipient"),
          usdt_trc20:settingValue("setting-usdt-wallet"),cryptobot_url:settingValue("setting-cryptobot-url"),
          enable_sbp:Boolean(document.getElementById("setting-enable-sbp").checked),enable_card:Boolean(document.getElementById("setting-enable-card").checked),
          enable_usdt:Boolean(document.getElementById("setting-enable-usdt").checked)
        };
        rpc("admin_save_settings",{
          p_rtp:Number(document.getElementById("setting-rtp").value)/100,p_streamer_mode:Boolean(document.getElementById("setting-streamer").checked),
          p_banner_title:document.getElementById("setting-banner").value,p_live_drop_speed:Number(document.getElementById("setting-speed").value),
          p_card_requisite:paymentSettings.card_number,p_sbp_requisite:paymentSettings.sbp_phone,p_usdt_requisite:paymentSettings.usdt_trc20,
          p_demo_deposit:Boolean(document.getElementById("setting-demo").checked),p_payment:paymentSettings
        }).then(refreshPublic).then(loadAdmin).then(function(){toast("Платежные настройки сохранены");}).catch(function(x){toast(x.message);});
      }
      else if(a==="admin-save-webhook-secret"){
        var secret=document.getElementById("webhook-secret").value;
        if(secret.length<32)return toast("Секрет должен содержать минимум 32 символа");
        rpc("admin_set_webhook_secret",{p_secret_key:secret}).then(function(){document.getElementById("webhook-secret").value="";toast("Webhook-секрет сохранён");}).catch(function(x){toast(x.message);});
      }
      else if(a==="admin-save-cryptobot"){
        var cryptoToken=document.getElementById("setting-cryptobot-token").value.trim();
        var usdtRub=Number(document.getElementById("setting-usdt-rub-rate").value),tonRub=Number(document.getElementById("setting-ton-rub-rate").value);
        if(!Number.isFinite(usdtRub)||usdtRub<=0||!Number.isFinite(tonRub)||tonRub<=0)return toast("Курсы USDT и TON должны быть больше нуля");
        rpc("admin_save_cryptobot_settings",{
          p_token:cryptoToken,p_usdt_rub_rate:usdtRub,p_ton_rub_rate:tonRub,
          p_enabled:Boolean(document.getElementById("setting-enable-cryptobot").checked)
        }).then(function(){
          document.getElementById("setting-cryptobot-token").value="";
          return refreshPublic();
        }).then(loadAdmin).then(function(){toast("Настройки CryptoBot сохранены");}).catch(function(x){toast(x.message||"Не удалось сохранить CryptoBot");});
      }
      else if(a==="admin-save-promo"){rpc("admin_save_promocode",{p_code:document.getElementById("promo-code").value,p_reward:Number(document.getElementById("promo-reward").value),p_activations:Number(document.getElementById("promo-limit").value)}).then(function(){toast("Промокод сохранен");}).catch(function(x){toast(x.message);});}
      else if(a==="admin-generate-promo"){var code="MD"+Math.random().toString(36).slice(2,8).toUpperCase();document.getElementById("promo-code").value=code;}
    });
    document.addEventListener("submit",function(e){if(e.target.dataset.form==="auth"){e.preventDefault();authSubmit(e.target);}});
    document.addEventListener("change",function(e){
      var target=e.target;
      if(target.id==="setting-rtp"){var out=document.getElementById("rtp-output");if(out)out.value=target.value+"%";}
      if(target.id==="crypto-asset")state.cryptoAsset=target.value;
      if(target.id==="case-image"||target.matches('[data-prize-field="image_url"]')){collectCaseEditor();render();return;}
      if(target.matches('[data-image-kind]')){
        var file=target.files&&target.files[0];if(!file)return;
        if(!/^image\/(png|jpeg|gif|webp)$/.test(file.type)||file.size>1048576){target.value="";return toast("Поддерживаются PNG/JPG/GIF/WebP до 1 МБ");}
        collectCaseEditor();
        var reader=new FileReader();
        reader.onload=function(){
          var url=String(reader.result||"");
          if(target.dataset.imageKind==="case")state.adminCase.image_url=url;
          else if(state.adminCaseItems[Number(target.dataset.index)])state.adminCaseItems[Number(target.dataset.index)].image_url=url;
          render();
        };
        reader.onerror=function(){toast("Не удалось прочитать файл изображения");};
        reader.readAsDataURL(file);
      }
    });
    window.addEventListener("focus",function(){
      if(!state.user)return;
      refreshProfile().then(function(){
        render();
        if(isAdmin()&&state.page==="admin")return loadAdmin();
      }).catch(function(e){console.error(e);});
    });

    async function init(){
      render();
      try{
        var session=await db.auth.getSession();
        if(session.error)throw session.error;
        state.session=session.data.session;state.user=state.session&&state.session.user;
      }catch(e){console.error(e);state.toast="Не удалось проверить сессию: "+(e.message||"ошибка Supabase Auth");}
      try{await refreshPublic();}
      catch(e){console.error(e);state.moneydropSchema=false;state.toast="Не удалось загрузить каталог: "+(e.message||"ошибка Supabase");}
      if(state.user){
        try{await refreshProfile();}
        catch(e){console.error(e);state.role="user";state.toast="Не удалось загрузить профиль: "+(e.message||"ошибка Supabase");}
      }
      render();
      if(isAdmin())await loadAdmin();
    }
    if(db)init();else{render();toast("Supabase JS не загрузился");}
  </script>
</body>
</html>
