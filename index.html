    function animateServerWin(index){

      state.reel=reel;render();
      var track=document.getElementById("roulette-track"),viewport=document.querySelector(".roulette-window");
      var pointer=viewport&&viewport.querySelector(".pointer"),card=track&&track.children[winnerIndex];
      if(!track||!viewport||!pointer||!card)return Promise.resolve();
      track.style.transition="none";track.style.transform="translateX(0px)";void track.offsetWidth;
      var cardRect=card.getBoundingClientRect(),pointerRect=pointer.getBoundingClientRect();
      var shift=(pointerRect.left+pointerRect.width/2)-(cardRect.left+cardRect.width/2);
      return new Promise(function(resolve){
        var finished=false,timer;
        function finish(event){
          if(event&&(event.target!==track||event.propertyName!=="transform"))return;
          if(finished)return;
          finished=true;clearTimeout(timer);track.removeEventListener("transitionend",finish);resolve();
        }
        track.addEventListener("transitionend",finish);
        timer=setTimeout(function(){finish();},2800);
        requestAnimationFrame(function(){
          track.style.transition="transform 2.4s cubic-bezier(.12,.75,.12,1)";
          track.style.transform="translateX("+shift+"px)";
        });
      });
    }

      try{
        var session=await db.auth.getSession();
        if(session.error)throw session.error;
        state.session=session.data.session;state.user=state.session&&state.session.user;
      }catch(e){console.error(e);state.toast="Не удалось проверить сессию: "+(e.message||"ошибка Supabase Auth");}
      try{await refreshPublic();}
      catch(e){console.error(e);state.moneydropSchema=false;state.toast="Не удалось загрузить каталог: "+(e.message||"ошибка Supabase");}
      if(state.user){
        try{await refreshProfile();}
        catch(e){console.error(e);state.role="user";state.toast="Не удалось загрузить профиль: "+(e.message||"ошибка Supabase");}
      }
      render();
      if(isAdmin())await loadAdmin();
    }
    if(db)init();else{render();toast("Supabase JS не загрузился");}
  </script>
</body>
</html>
